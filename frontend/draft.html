<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Draft Analysis</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #080f18;
      --bg2:       #0c1622;
      --bg3:       #101e2e;
      --border:    #1a3048;
      --teal:      #00c9c9;
      --teal-glow: rgba(0,201,201,0.12);
      --red:       #e84040;
      --green:     #3ecf6e;
      --gold:      #f0b429;
      --blue:      #60b8e8;
      --purple:    #a78bfa;
      --text:      #b8cfe0;
      --text-dim:  #4a6880;
      --text-hi:   #e8f4ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; min-height: 100vh; display: flex; flex-direction: column; }
    .layout { display: flex; flex: 1; min-height: 0; }

    /* ── MODE SWITCH (Análise de Time / Campeões) ── */
    .mode-switch { display: flex; gap: 4px; padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); }
    .mode-btn { padding: 7px 16px; border-radius: 4px; cursor: pointer; color: var(--text-dim); font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; transition: all .15s; }
    .mode-btn:hover { color: var(--text); background: var(--bg3); }
    .mode-btn.ativo { color: var(--teal); background: var(--teal-glow); }

    .sidebar { width: 210px; min-width: 210px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 10px; gap: 8px; overflow: hidden; }
    .sidebar-modo { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .sidebar-logo { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: var(--teal); letter-spacing: 2px; text-transform: uppercase; padding: 0 4px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .sidebar-logo span { color: var(--text-dim); font-weight: 500; }
    .sidebar label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 0 4px; margin-top: 4px; }
    .sidebar input, .sidebar select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 9px; border-radius: 4px; font-size: 12px; width: 100%; font-family: 'Inter', sans-serif; transition: border-color .15s; }
    .sidebar input:focus, .sidebar select:focus { outline: none; border-color: var(--teal); }
    .sidebar select option { background: var(--bg2); }
    .times-lista { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
    .times-lista::-webkit-scrollbar { width: 3px; }
    .times-lista::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tabela-scroll {
      max-height: 280px;
      overflow-y: auto;
    }
    .tabela-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .tabela-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .time-item { padding: 7px 9px; border-radius: 3px; cursor: pointer; font-size: 12px; color: var(--text-dim); transition: all .12s; border-left: 2px solid transparent; }
    .time-item:hover { background: var(--bg3); color: var(--text); }
    .time-item.ativo { background: var(--teal-glow); color: var(--teal); border-left-color: var(--teal); font-weight: 600; }

    .content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; min-width: 0; }
    .empty { color: var(--text-dim); font-size: 15px; text-align: center; margin-top: 100px; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; }
    .loading { color: var(--teal); text-align: center; padding: 40px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .page-header { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 16px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .page-title { font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; color: var(--text-hi); letter-spacing: 1px; }
    .page-sub { color: var(--text-dim); font-size: 11px; margin-top: 2px; letter-spacing: .5px; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { background: var(--bg3); border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .pill strong { color: var(--teal); margin-left: 4px; }

    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab { padding: 8px 18px; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; text-transform: uppercase; letter-spacing: .8px; font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600; }
    .tab:hover { color: var(--text); }
    .tab.ativo { color: var(--teal); border-bottom-color: var(--teal); }
    .tab-content { display: none; flex-direction: column; gap: 14px; }
    .tab-content.ativo { display: flex; }

    .secao-label { font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); padding: 4px 0 2px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    @media (max-width: 1100px) { .grid-5 { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 800px)  { .grid-2, .grid-5 { grid-template-columns: 1fr; } }

    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
    .card-header { padding: 8px 13px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--border); }
    .card-header.azul     { background: #091828; color: var(--blue); }
    .card-header.verde    { background: #091a10; color: var(--green); }
    .card-header.vermelho { background: #180909; color: var(--red); }
    .card-header.gold     { background: #1a1400; color: var(--gold); }
    .card-header.teal     { background: #051515; color: var(--teal); }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .azul .dot     { background: var(--blue);  box-shadow: 0 0 6px var(--blue); }
    .verde .dot    { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .vermelho .dot { background: var(--red);   box-shadow: 0 0 6px var(--red); }
    .gold .dot     { background: var(--gold);  box-shadow: 0 0 6px var(--gold); }
    .teal .dot     { background: var(--teal);  box-shadow: 0 0 6px var(--teal); }

    /* ── TABELA PADRÃO ── */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { background: var(--bg); color: var(--text-dim); text-align: left; padding: 5px 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; white-space: nowrap; }
    td { padding: 5px 10px; border-top: 1px solid #0d1e2e; white-space: nowrap; }
    tr:hover td { background: rgba(0,201,201,0.04); }
    td:first-child { color: var(--text-hi); font-weight: 500; }
    .bar-cell { display: flex; align-items: center; gap: 6px; min-width: 80px; }
    .bar-wrap  { flex: 1; height: 4px; background: #0d1e2e; border-radius: 2px; min-width: 30px; }
    .bar-fill  { height: 4px; border-radius: 2px; }
    .bar-teal  { background: var(--teal); }
    .bar-red   { background: var(--red); }
    .bar-green { background: var(--green); }
    .bar-gold  { background: var(--gold); }
    .bar-blue  { background: var(--blue); }
    .bar-purple { background: var(--purple); }
    .bar-pct   { min-width: 34px; text-align: right; font-size: 11px; color: var(--text-dim); }
    .val-dim   { color: var(--text-dim); }
    .wr-badge  { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; }
    .wr-hi  { background: rgba(62,207,110,.15);  color: var(--green); }
    .wr-mid { background: rgba(240,180,41,.1);   color: var(--gold); }
    .wr-lo  { background: rgba(232,64,64,.15);   color: var(--red); }

    /* ── PICKS POR ROTA ── */
    .rota-col { display: flex; flex-direction: column; gap: 8px; }

    /* Header colorido da rota */
    .rota-top .rota-header-bar { background: rgba(96,184,232,.10); color: var(--blue);   border-bottom: 2px solid var(--blue); }
    .rota-jng .rota-header-bar { background: rgba(96,184,232,.10); color: var(--blue);   border-bottom: 2px solid var(--blue); }
    .rota-mid .rota-header-bar { background: rgba(96,184,232,.10); color: var(--blue);   border-bottom: 2px solid var(--blue); }
    .rota-bot .rota-header-bar { background: rgba(96,184,232,.10); color: var(--blue);   border-bottom: 2px solid var(--blue); }
    .rota-sup .rota-header-bar { background: rgba(96,184,232,.10); color: var(--blue);   border-bottom: 2px solid var(--blue); }

    /* Card de cada player */
    .player-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }

    .player-card-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: var(--bg3); border-bottom: 1px solid var(--border); }
    .player-name { font-weight: 600; font-size: 12px; color: var(--text-hi); }
    .player-meta { display: flex; align-items: center; gap: 5px; }
    .player-jogos { font-size: 10px; color: var(--text-dim); }
    .player-sub-badge { font-size: 9px; background: rgba(240,180,41,.15); color: var(--gold); padding: 1px 5px; border-radius: 3px; font-weight: 700; text-transform: uppercase; }

    /* Barra da rota usada dentro das tabelas de player */
    .bar-rota-top    { background: var(--blue); }
    .bar-rota-jng    { background: var(--blue); }
    .bar-rota-mid    { background: var(--blue); }
    .bar-rota-bot    { background: var(--blue); }
    .bar-rota-sup    { background: var(--blue); }

    /* ── CAMPEÕES ── */
    .clicavel { cursor: pointer; }
    .stat-mini { padding: 12px; text-align: center; }
    .stat-mini-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 6px; }
    .stat-mini-val { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; color: var(--text-hi); }
    .txt-green { color: var(--green); } .txt-blue { color: var(--blue); } .txt-red { color: var(--red); } .txt-gold { color: var(--gold); }
    .side-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; }
    .side-block { padding: 14px; }
    .duplas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }

    /* ── LIGAS (multi-seleção) ── */
    .ligas-lista { display: flex; flex-direction: column; gap: 3px; max-height: 160px; overflow-y: auto; margin-top: 4px; }
    .liga-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); padding: 2px 4px; cursor: pointer; }
    .liga-check input { width: auto; }

    /* ── SANDBOX ── */
    .btn-primary { margin-top: 12px; background: var(--teal); color: #00161a; border: none; padding: 8px 10px; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-family: 'Inter', sans-serif; }
    .btn-primary:hover { opacity: .85; }
    .chips-lista { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; min-height: 8px; }
    .chip { display: flex; align-items: center; gap: 5px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 3px 4px 3px 8px; border-radius: 4px; font-size: 11px; }
    .chip-x { cursor: pointer; color: var(--text-dim); font-weight: 700; padding: 0 3px; }
    .chip-x:hover { color: var(--red); }
  </style>
</head>
<body>

<div class="mode-switch">
  <div class="mode-btn ativo" data-modo="time"     onclick="mudarModo('time')">Análise de Time</div>
  <div class="mode-btn"       data-modo="campeoes" onclick="mudarModo('campeoes')">Campeões</div>
  <div class="mode-btn"       data-modo="sandbox"  onclick="mudarModo('sandbox')">Sandbox</div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">Draft<span>Lab</span></div>
    <label>Temporada</label>
    <select id="anoSelect">
      <option value="">Todas</option>
      <option value="2025">2025</option>
      <option value="2026" selected>2026</option>
    </select>

    <!-- MODO: análise de um time -->
    <div id="sidebar-time" class="sidebar-modo">
      <label>Buscar time</label>
      <input id="buscaTime" placeholder="Nome do time..." oninput="filtrarTimes()">
      <label style="margin-top:10px">Times</label>
      <div class="times-lista" id="listaTimesEl"></div>
    </div>

    <!-- MODO: hub de campeões -->
    <div id="sidebar-campeoes" class="sidebar-modo" style="display:none">
      <label>Buscar campeão</label>
      <input id="buscaCampeao" placeholder="Nome do campeão..." oninput="filtrarCampeoesLista()">
      <label style="margin-top:10px">Posição</label>
      <select id="posicaoSelect" onchange="carregarListaCampeoes()">
        <option value="">Todas</option>
        <option value="top">Top</option>
        <option value="jng">Jungle</option>
        <option value="mid">Mid</option>
        <option value="bot">Bot</option>
        <option value="sup">Support</option>
      </select>
      <label style="margin-top:10px">Ligas</label>
      <div class="ligas-lista" id="ligasLista"></div>
    </div>

    <!-- MODO: sandbox multi-campeões -->
    <div id="sidebar-sandbox" class="sidebar-modo" style="display:none">
      <label>Aliados (1 a 5)</label>
      <input id="inputAliado" list="campeoesDatalist" placeholder="Nome do campeão..." onkeydown="if(event.key==='Enter'){event.preventDefault();adicionarChip('aliado');}">
      <div class="chips-lista" id="chipsAliados"></div>

      <label style="margin-top:14px">Inimigos (1 a 5)</label>
      <input id="inputInimigo" list="campeoesDatalist" placeholder="Nome do campeão..." onkeydown="if(event.key==='Enter'){event.preventDefault();adicionarChip('inimigo');}">
      <div class="chips-lista" id="chipsInimigos"></div>

      <button class="btn-primary" onclick="buscarConfrontos()">Buscar</button>
    </div>

    <datalist id="campeoesDatalist"></datalist>
  </aside>

  <div class="content" id="content">
    <div class="empty">← Selecione um time</div>
  </div>
</div>

<script>
const API = 'http://localhost:5000';
let todosOsTimes = [];
let timeSelecionado = '';
let modoAtivo = 'time';
let todosOsCampeoesLista = [];
let ligasSelecionadas = ['CBLOL'];

const ROTA_LABEL = { top:'Top', jng:'Jungle', mid:'Mid', bot:'Bot', sup:'Support' };
const ROTA_ORDER = ['top','jng','mid','bot','sup'];

// Regra de cor única pro site inteiro: exatamente 50% = amarelo,
// qualquer coisa acima (mesmo 50.1%) = verde, abaixo = vermelho.
function corWR(wr) {
  if (wr === null || wr === undefined) return 'wr-mid';
  if (wr > 50) return 'wr-hi';
  if (wr === 50) return 'wr-mid';
  return 'wr-lo';
}

async function init() {
  try {
    const r = await fetch(`${API}/times`);
    todosOsTimes = await r.json();
    renderTimes(todosOsTimes);
  } catch(e) {
    document.getElementById('listaTimesEl').innerHTML =
      '<div style="color:var(--red);padding:8px;font-size:11px">Erro ao conectar (porta 5000)</div>';
  }

  try {
    const rl = await fetch(`${API}/ligas/disponiveis`);
    const { ligas } = await rl.json();
    renderLigasLista(ligas);
  } catch(e) { /* segue com CBLOL default se não conseguir carregar */ }

  try {
    const rc = await fetch(`${API}/campeoes`);
    const nomes = await rc.json();
    document.getElementById('campeoesDatalist').innerHTML =
      nomes.map(n => `<option value="${n}">`).join('');
  } catch(e) { /* datalist é só bônus de autocomplete */ }
}

function renderLigasLista(ligas) {
  const el = document.getElementById('ligasLista');
  el.innerHTML = ligas.map(l => `
    <label class="liga-check">
      <input type="checkbox" value="${l}" ${ligasSelecionadas.includes(l) ? 'checked' : ''} onchange="alternarLiga('${l}', this.checked)">
      ${l}
    </label>
  `).join('');
}

function alternarLiga(liga, marcado) {
  if (marcado && !ligasSelecionadas.includes(liga)) ligasSelecionadas.push(liga);
  else if (!marcado) ligasSelecionadas = ligasSelecionadas.filter(l => l !== liga);

  if (ligasSelecionadas.length === 0) ligasSelecionadas = [liga]; // não deixa ficar sem nenhuma

  carregarListaCampeoes();
}

function queryLigas() {
  return ligasSelecionadas.map(l => `ligas=${encodeURIComponent(l)}`).join('&');
}

// ── Troca de modo (Análise de Time / Campeões / Sandbox) ───
function mudarModo(modo) {
  modoAtivo = modo;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('ativo', b.dataset.modo === modo));
  document.querySelectorAll('.sidebar-modo').forEach(s => s.style.display = 'none');
  document.getElementById('sidebar-' + modo).style.display = 'flex';

  const c = document.getElementById('content');

  if (modo === 'time') {
    if (timeSelecionado) carregarTime(timeSelecionado);
    else c.innerHTML = '<div class="empty">← Selecione um time</div>';
  } else if (modo === 'campeoes') {
    carregarListaCampeoes();
  } else if (modo === 'sandbox') {
    c.innerHTML = '<div class="empty">← Adicione de 1 a 5 aliados e de 1 a 5 inimigos e clique em Buscar</div>';
  }
}

function filtrarTimes() {
  const b = document.getElementById('buscaTime').value.toLowerCase();
  renderTimes(todosOsTimes.filter(t => t.toLowerCase().includes(b)));
}

function renderTimes(lista) {
  document.getElementById('listaTimesEl').innerHTML = lista.map(t =>
    `<div class="time-item${t===timeSelecionado?' ativo':''}" onclick="carregarTime('${t.replace(/'/g,"\\'")}')">${t}</div>`
  ).join('');
}

async function carregarTime(nome) {
  timeSelecionado = nome;
  filtrarTimes();
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading">Carregando...</div>';

  const ano = document.getElementById('anoSelect').value;
  const enc = encodeURIComponent(nome);
  const url = `${API}/stats/draft?nome=${enc}${ano ? '&ano='+ano : ''}`;

  try {
    const d = await fetch(url).then(r => r.json());
    if (d.detail) throw new Error(d.detail);
    renderAnalise(d);
  } catch(e) {
    c.innerHTML = `<div class="empty" style="color:var(--red)">Erro: ${e.message}</div>`;
  }
}

function renderAnalise(d) {
  const c = document.getElementById('content');
  const anoLabel = d.ano ? `Temporada ${d.ano}` : 'Todas as temporadas';

  c.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">${d.time}</div>
        <div class="page-sub">${anoLabel}</div>
      </div>
      <div class="pills">
        <div class="pill">Total <strong>${d.geral.jogos}</strong></div>
        <div class="pill">FP (Azul) <strong>${d.fp.jogos}</strong></div>
        <div class="pill">LP (Vermelho) <strong>${d.lp.jogos}</strong></div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab ativo" onclick="trocarAba('geral',this)">Geral</div>
      <div class="tab"       onclick="trocarAba('fp',this)">First Pick</div>
      <div class="tab"       onclick="trocarAba('lp',this)">Last Pick</div>
    </div>

    <div id="aba-geral" class="tab-content ativo">${renderBloco(d.geral, d.picks_jogador)}</div>
    <div id="aba-fp"    class="tab-content">${renderBloco(d.fp, null)}</div>
    <div id="aba-lp"    class="tab-content">${renderBloco(d.lp, null)}</div>
  `;
}

function trocarAba(nome, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('ativo'));
  el.classList.add('ativo');
  document.getElementById('aba-' + nome).classList.add('ativo');
}

function renderBloco(b, picksPorJogador) {
  return `
    <div class="secao-label">Picks</div>
    <div class="grid-2">
      <div class="card">
        <div class="card-header verde"><span class="dot"></span>Picks do Time</div>
        ${tabelaPicks(b.picks, 'bar-green')}
      </div>
      <div class="card">
        <div class="card-header gold"><span class="dot"></span>Prioridade First Pick (P1)</div>
        ${tabelaFP(b.prioridade_fp)}
      </div>
    </div>

    <div class="secao-label">Seus Bans</div>
    <div class="grid-2">
      <div class="card">
        <div class="card-header teal"><span class="dot"></span>Bans Fase 1</div>
        ${tabelaBans(b.bans_f1, 'teal', 'qtd', 'rate')}
      </div>
      <div class="card">
        <div class="card-header azul"><span class="dot"></span>Bans Totais</div>
        ${tabelaBans(b.seus_bans, 'blue', 'bans_totais', 'rate')}
      </div>
    </div>

    <div class="secao-label">Bans do Adversário Contra Você</div>
    <div class="grid-2">
      <div class="card">
        <div class="card-header vermelho"><span class="dot"></span>Bans Fase 1</div>
        ${tabelaBans(b.bans_adv_f1, 'red', 'qtd', 'rate')}
      </div>
      <div class="card">
        <div class="card-header vermelho"><span class="dot"></span>Bans Totais</div>
        ${tabelaBans(b.bans_contra, 'red', 'bans_totais', 'rate')}
      </div>
    </div>

    ${picksPorJogador ? `
      <div class="secao-label">Pool por Rota & Jogador</div>
      ${renderPicksPorJogador(picksPorJogador)}
    ` : ''}
  `;
}

// ── Pool por Rota — mesmo layout de "Picks do Time" ───────
function renderPicksPorJogador(ppj) {
  const cols = ROTA_ORDER.map(rota => {
    const players = ppj[rota] ?? [];
    if (!players.length) return `
      <div class="rota-col rota-${rota}">
        <div class="rota-header-bar">${ROTA_LABEL[rota]}</div>
      </div>`;

    const barClass = `bar-rota-${rota}`;

    const playersHtml = players.map(p => {
      const isSub    = !p.titular;
      const maxPicks = p.picks?.[0]?.picks ?? 1;

      // Mesmas colunas de tabelaPicks: Campeão | Pick Rate (barra+%) | # | Win Rate
      const linhas = (p.picks ?? []).map(row => {
        const nome = row.champion ?? row.index ?? '?';
        const barW = Math.min(100, Math.round(((row.picks ?? 0) / maxPicks) * 100));
        const wr   = row.win_rate ?? 0;
        const wrC  = wr >= 60 ? 'wr-hi' : wr >= 45 ? 'wr-mid' : 'wr-lo';
        return `<tr>
          <td>${nome}</td>
          <td><div class="bar-cell">
            <div class="bar-wrap"><div class="bar-fill ${barClass}" style="width:${barW}%"></div></div>
            <span class="bar-pct val-dim">${row.pick_rate ?? 0}%</span>
          </div></td>
          <td class="val-dim">${row.picks ?? 0}</td>
          <td><span class="wr-badge ${wrC}">${wr}%</span></td>
        </tr>`;
      }).join('');

      const tabela = linhas
        ? `<table>
            <thead><tr>
              <th>Campeão</th><th>Pick Rate</th><th>#</th><th>Win Rate</th>
            </tr></thead>
            <tbody>${linhas}</tbody>
           </table>`
        : '<div style="padding:10px;color:var(--text-dim);font-size:11px">Sem dados</div>';

      return `
        <div class="player-card">
          <div class="player-card-header">
            <span class="player-name">${p.player}</span>
            <div class="player-meta">
              ${isSub ? '<span class="player-sub-badge">Reserva</span>' : ''}
              <span class="player-jogos">${p.jogos} Partidas</span>
            </div>
          </div>
          ${tabela}
        </div>`;
    }).join('');

    return `
      <div class="rota-col rota-${rota}">
        <div class="rota-header-bar">${ROTA_LABEL[rota]}</div>
        ${playersHtml}
      </div>`;
  }).join('');

  return `<div class="grid-5">${cols}</div>`;
}

// ── Tabelas padrão ────────────────────────────────────────
function tabelaPicks(lista, barClass = 'bar-green') {
  if (!lista?.length) return vazio();
  const max = lista[0]?.picks ?? 1;
  return `<table>
    <thead><tr><th>Campeão</th><th>Pick Rate</th><th>#</th><th>Win Rate</th></tr></thead>
    <tbody>${lista.map(row => {
      const wr = row.win_rate ?? 0;
      const barW = Math.min(100, Math.round((row.picks / max) * 100));
      const wrC = wr >= 60 ? 'wr-hi' : wr >= 45 ? 'wr-mid' : 'wr-lo';
      return `<tr>
        <td>${row.champion}</td>
        <td><div class="bar-cell"><div class="bar-wrap"><div class="bar-fill ${barClass}" style="width:${barW}%"></div></div><span class="bar-pct val-dim">${row.pick_rate}%</span></div></td>
        <td class="val-dim">${row.picks}</td>
        <td><span class="wr-badge ${wrC}">${wr}%</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function tabelaFP(lista) {
  if (!lista?.length) return vazio();
  const max = lista[0]?.picks ?? 1;
  return `<table>
    <thead><tr><th>Campeão</th><th>Freq. P1</th><th>#</th></tr></thead>
    <tbody>${lista.map(row => {
      const barW = Math.min(100, Math.round((row.picks / max) * 100));
      return `<tr>
        <td>${row.champion}</td>
        <td><div class="bar-cell"><div class="bar-wrap"><div class="bar-fill bar-gold" style="width:${barW}%"></div></div><span class="bar-pct val-dim">${row.pick_rate}%</span></div></td>
        <td class="val-dim">${row.picks}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function tabelaBans(lista, cor, campoQtd, campoPct) {
  if (!lista?.length) return vazio();
  const max = lista[0]?.[campoQtd] ?? 1;
  const barC = { teal:'bar-teal', blue:'bar-blue', red:'bar-red', gold:'bar-gold' }[cor] ?? 'bar-teal';
  return `<table>
    <thead><tr><th>Campeão</th><th>Rate</th><th>#</th></tr></thead>
    <tbody>${lista.map(row => {
      const barW = Math.min(100, Math.round((row[campoQtd] / max) * 100));
      return `<tr>
        <td>${row.champion}</td>
        <td><div class="bar-cell"><div class="bar-wrap"><div class="bar-fill ${barC}" style="width:${barW}%"></div></div><span class="bar-pct">${row[campoPct]}%</span></div></td>
        <td class="val-dim">${row[campoQtd]}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function vazio() {
  return '<div style="padding:14px;color:var(--text-dim);font-size:12px">Sem dados</div>';
}

// ═══════════════════════════════════════════════════════════
// CAMPEÕES — Lista (Champion Intelligence) + Hub do campeão
// ═══════════════════════════════════════════════════════════
async function carregarListaCampeoes() {
  const ano = document.getElementById('anoSelect').value;
  const pos = document.getElementById('posicaoSelect').value;
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading">Carregando...</div>';

  const url = `${API}/stats/campeoes?${queryLigas()}${ano ? '&year=' + ano : ''}${pos ? '&posicao=' + pos : ''}`;

  try {
    const lista = await fetch(url).then(r => r.json());
    if (lista.detail) throw new Error(lista.detail);
    todosOsCampeoesLista = lista;
    renderListaCampeoes(lista);
  } catch(e) {
    c.innerHTML = `<div class="empty" style="color:var(--red)">Erro: ${e.message}</div>`;
  }
}

function filtrarCampeoesLista() {
  const b = document.getElementById('buscaCampeao').value.toLowerCase();
  renderListaCampeoes((todosOsCampeoesLista || []).filter(c => c.champion.toLowerCase().includes(b)));
}

function renderListaCampeoes(lista) {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Champion Intelligence</div>
        <div class="page-sub">${lista.length} campeões</div>
      </div>
    </div>
    <div class="card">
      ${lista.length ? `<table>
        <thead><tr>
          <th>Campeão</th><th>Posição</th><th>Win Rate</th><th>Jogos</th><th>Pick Rate</th><th>Bans</th><th>Ban Rate</th><th>Presença</th><th>FP WR</th><th>LP WR</th>
        </tr></thead>
        <tbody>
          ${lista.map(camp => {
            const wr = camp.win_rate ?? 0;
            const wrC = corWR(wr);
            const nomeEsc = camp.champion.replace(/'/g, "\\'");
            return `<tr class="clicavel" onclick="abrirCampeao('${nomeEsc}')">
              <td>${camp.champion}</td>
              <td class="val-dim">${(camp.posicao || '').toUpperCase()}</td>
              <td><span class="wr-badge ${wrC}">${wr}%</span></td>
              <td class="val-dim">${camp.jogos}</td>
              <td class="val-dim">${camp.pick_rate}%</td>
              <td class="val-dim">${camp.bans}</td>
              <td class="val-dim">${camp.ban_rate}%</td>
              <td class="val-dim">${camp.presence}%</td>
              <td class="val-dim">${camp.fp_wr}%</td>
              <td class="val-dim">${camp.lp_wr}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : vazio()}
    </div>
  `;
}

async function abrirCampeao(nome) {
  const ano = document.getElementById('anoSelect').value;
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading">Carregando...</div>';

  const url = `${API}/stats/campeao?campeao=${encodeURIComponent(nome)}&${queryLigas()}${ano ? '&year=' + ano : ''}`;

  try {
    const d = await fetch(url).then(r => r.json());
    if (d.detail) throw new Error(d.detail);
    renderCampeaoHub(d);
  } catch(e) {
    c.innerHTML = `<div class="empty" style="color:var(--red)">Erro: ${e.message}</div>`;
  }
}

function renderCampeaoHub(d) {
  const c = document.getElementById('content');
  const s = d.stats || {};

  const statCard = (label, val, cls) => `
    <div class="card stat-mini">
      <div class="stat-mini-label">${label}</div>
      <div class="stat-mini-val ${cls || ''}">${val}</div>
    </div>`;

  const fpWr = s.fp_wr ?? 0;
  const lpWr = s.lp_wr ?? 0;

  c.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">${d.campeao}</div>
        <div class="page-sub">${d.total_jogos} jogos na base${(d.rotas_campeao||[]).length ? ' · Joga: ' + d.rotas_campeao.map(r => ROTA_LABEL[r] || r).join(', ') : ''}</div>
      </div>
      <div class="pills">
        <div class="pill clicavel" onclick="renderListaCampeoes(todosOsCampeoesLista)">← Voltar à lista</div>
      </div>
    </div>

    <div class="grid-5">
      ${statCard('Win Rate', (s.win_rate ?? 0) + '%', 'txt-green')}
      ${statCard('Pick Rate', (s.pick_rate ?? 0) + '%', 'txt-blue')}
      ${statCard('Ban Rate', (s.ban_rate ?? 0) + '%', 'txt-red')}
      ${statCard('Presença', (s.presence ?? 0) + '%', 'txt-gold')}
      ${statCard('Jogos', s.jogos ?? 0, '')}
    </div>

    <div class="card">
      <div class="card-header teal"><span class="dot"></span>First Pick × Last Pick</div>
      <div class="side-block">
        <div class="side-row"><span style="color:var(--gold)">First Pick</span><span class="val-dim">${s.fp_jogos ?? 0} jogos</span></div>
        <div class="bar-wrap" style="height:6px;margin:4px 0"><div class="bar-fill bar-gold" style="width:${fpWr}%;height:6px"></div></div>
        <div style="color:var(--green);font-weight:600;margin-bottom:14px">${fpWr}% Win Rate</div>

        <div class="side-row"><span style="color:var(--purple)">Last Pick</span><span class="val-dim">${s.lp_jogos ?? 0} jogos</span></div>
        <div class="bar-wrap" style="height:6px;margin:4px 0"><div class="bar-fill bar-purple" style="width:${lpWr}%;height:6px"></div></div>
        <div style="color:var(--green);font-weight:600">${lpWr}% Win Rate</div>
      </div>
    </div>

    <div class="secao-label">Duplas Mais Comuns Por Rota</div>
    ${renderDuplas(d.duplas)}

    <div class="grid-2">
      <div class="card">
        <div class="card-header verde"><span class="dot"></span>Melhores Matchups (Forte Contra)</div>
        ${tabelaMatchup(d.forte_contra)}
      </div>
      <div class="card">
        <div class="card-header vermelho"><span class="dot"></span>Piores Matchups (Fraco Contra)</div>
        ${tabelaMatchup(d.fraco_contra)}
      </div>
    </div>

    <div class="secao-label">Top Jogadores</div>
    <div class="card">
      ${tabelaTopPlayers(d.top_players)}
    </div>
  `;
}

function renderDuplas(duplas) {
  if (!duplas) return vazio();

  const rotasComDados = ROTA_ORDER.filter(r => (duplas[r] || []).length);
  if (!rotasComDados.length) {
    return `<div class="card">${vazio()}</div>`;
  }

  const cards = rotasComDados.map(r => {
    const linhas = duplas[r].map((dup, i) => `
      <tr>
        <td class="val-dim">${i + 1}</td>
        <td>${dup.champion}</td>
        <td class="val-dim">${dup.jogos}</td>
        <td class="val-dim">${dup.frequencia}%</td>
        <td><span class="wr-badge ${corWR(dup.win_rate)}">${dup.win_rate}%</span></td>
      </tr>`).join('');

    return `
      <div class="card">
        <div class="card-header azul"><span class="dot"></span>${ROTA_LABEL[r]}</div>
        <table>
          <thead><tr><th>#</th><th>Campeão</th><th>Jogos</th><th>Freq.</th><th>Win Rate</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }).join('');

  return `<div class="duplas-grid">${cards}</div>`;
}

function tabelaTopPlayers(lista) {
  if (!lista?.length) return vazio();
  return `<table>
    <thead><tr><th>#</th><th>Jogador</th><th>Time</th><th>Jogos</th><th>Win Rate</th></tr></thead>
    <tbody>${lista.map((p, i) => {
      const wrC = corWR(p.win_rate);
      return `<tr>
        <td class="val-dim">${i + 1}</td>
        <td>${p.player}</td>
        <td class="val-dim">${p.time}</td>
        <td class="val-dim">${p.partidas}</td>
        <td><span class="wr-badge ${wrC}">${p.win_rate}%</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function tabelaMatchup(lista) {
  if (!lista?.length) return vazio();
  return `<div class="tabela-scroll"><table>
    <thead><tr><th>Campeão</th><th>Win Rate</th><th>Jogos</th><th>Resposta</th></tr></thead>
    <tbody>${lista.map(m => {
      const wrC = corWR(m.win_rate);
      return `<tr>
        <td>${m.champion}</td>
        <td><span class="wr-badge ${wrC}">${m.win_rate}%</span></td>
        <td class="val-dim">${m.jogos}</td>
        <td class="val-dim">${m.resposta_rate}%</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('anoSelect').addEventListener('change', () => {
    if (modoAtivo === 'time' && timeSelecionado) carregarTime(timeSelecionado);
    else if (modoAtivo === 'campeoes') carregarListaCampeoes();
  });
});

// ═══════════════════════════════════════════════════════════
// SANDBOX — matchup direto campeão x campeão (aliados x inimigos)
// ═══════════════════════════════════════════════════════════
let chipsAliados = [];
let chipsInimigos = [];

function adicionarChip(lado) {
  const inputEl = document.getElementById(lado === 'aliado' ? 'inputAliado' : 'inputInimigo');
  const nome = inputEl.value.trim();
  if (!nome) return;

  const lista = lado === 'aliado' ? chipsAliados : chipsInimigos;

  if (lista.length >= 5) return;
  if (lista.some(c => c.toLowerCase() === nome.toLowerCase())) {
    inputEl.value = '';
    return;
  }

  lista.push(nome);
  inputEl.value = '';
  renderChips(lado);
}

function removerChip(lado, nome) {
  if (lado === 'aliado') chipsAliados = chipsAliados.filter(c => c !== nome);
  else chipsInimigos = chipsInimigos.filter(c => c !== nome);
  renderChips(lado);
}

function renderChips(lado) {
  const lista = lado === 'aliado' ? chipsAliados : chipsInimigos;
  const el = document.getElementById(lado === 'aliado' ? 'chipsAliados' : 'chipsInimigos');
  el.innerHTML = lista.map(nome => `
    <span class="chip">${nome}<span class="chip-x" onclick="removerChip('${lado}','${nome.replace(/'/g, "\\'")}')">×</span></span>
  `).join('');
}

async function buscarConfrontos() {
  const c = document.getElementById('content');

  if (chipsAliados.length < 1 || chipsInimigos.length < 1) {
    c.innerHTML = '<div class="empty" style="color:var(--red)">Adicione pelo menos 1 aliado e 1 inimigo</div>';
    return;
  }

  c.innerHTML = '<div class="loading">Carregando...</div>';

  const params = new URLSearchParams();
  chipsAliados.forEach(a => params.append('aliados', a));
  chipsInimigos.forEach(i => params.append('inimigos', i));

  try {
    const d = await fetch(`${API}/stats/matchups-confronto?${params.toString()}`).then(r => r.json());
    if (d.detail) throw new Error(d.detail);
    renderConfrontos(d);
  } catch(e) {
    c.innerHTML = `<div class="empty" style="color:var(--red)">Erro: ${e.message}</div>`;
  }
}

function renderConfrontos(d) {
  const c = document.getElementById('content');

  const blocos = d.matchups.map(linha => {
    const linhas = linha.confrontos.map(cf => {
      if (cf.win_rate === null) {
        return `<tr>
          <td>${cf.aliado}</td>
          <td class="val-dim" colspan="3">Sem dados desse confronto na base</td>
        </tr>`;
      }
      return `<tr>
        <td>${cf.aliado}</td>
        <td class="val-dim">${cf.jogos}</td>
        <td class="val-dim">${cf.vitorias}V / ${cf.derrotas}D</td>
        <td><span class="wr-badge ${corWR(cf.win_rate)}">${cf.win_rate}%</span></td>
      </tr>`;
    }).join('');

    return `
      <div class="card">
        <div class="card-header vermelho"><span class="dot"></span>Contra ${linha.inimigo}</div>
        <table>
          <thead><tr><th>Aliado</th><th>Jogos</th><th>V/D</th><th>Win Rate</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }).join('');

  c.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">${d.aliados.join(' + ')} vs ${d.inimigos.join(' + ')}</div>
        <div class="page-sub">Win rate de cada aliado contra cada inimigo, confronto direto (matchup_total/matchup_vitorias)</div>
      </div>
    </div>
    <div class="duplas-grid">${blocos}</div>
  `;
}

init();
</script>
