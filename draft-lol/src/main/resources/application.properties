spring.application.name=draft-lol
springdoc.swagger-ui.path=/docs

# --- Feign (chamadas ao Python) ---
spring.cloud.openfeign.client.config.default.connect-timeout=${PYTHON_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.default.read-timeout=${PYTHON_READ_TIMEOUT_MS:8000}

# --- Limpeza de sessoes ---
# Roda a cada 2 h e apaga sessoes sem nenhum acesso ha mais de 2 h.
draft.limpeza.intervalo-ms=7200000
draft.limpeza.inatividade-ms=7200000

# --- Limites anti-abuso ---
draft.limite-sugestoes-por-sessao=${DRAFT_LIMITE_SUGESTOES:100}
draft.limite-sessoes-por-ip=${DRAFT_LIMITE_SESSOES_IP:10}
# Quantos proxies confiaveis ha na frente do Java (CloudFront + ALB = 2).
draft.proxies-confiaveis=${DRAFT_PROXIES_CONFIAVEIS:2}
